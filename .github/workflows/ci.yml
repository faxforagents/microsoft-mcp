name: ci

# Runs the local validation of the README on every push to main and on pull requests.
# Actions are pinned by commit SHA, with the version in a comment.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Every other run has a group of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: manifest, tool schemas, icons and review cases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      # Offline: the pinned schema and the packaged tool definitions. The --download-schema and --submission
      # checks reach Microsoft and the hosted server, so they stay manual.
      - run: sh scripts/validate.sh
